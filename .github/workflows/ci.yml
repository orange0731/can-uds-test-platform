name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:        # 支持在Actions页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # 某个版本失败时其他版本继续跑完，便于定位版本特有问题
      matrix:
        python-version: ['3.10', '3.11', '3.12']   # 主流版本兼容性矩阵

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest

      - name: Archive test reports
        if: always()        # 失败时同样归档报告，便于排查
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            reports/uds_test_report.html
            reports/coverage_html/