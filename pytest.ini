# ==============================
# pytest 自动化测试主配置
# ==============================

[pytest]

# 所有测试用例位于 tests/ 目录。
testpaths =
    tests

# 测试文件、测试类和测试函数命名规则。
python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

# 默认执行参数。
# 直接运行 python -m pytest 即可完成：
# 1. 执行全部测试；
# 2. 生成 pytest-html 测试报告；
# 3. 统计语句和分支覆盖率；
# 4. 生成 HTML/XML 覆盖率报告；
# 5. 覆盖率低于 100% 时让 CI 失败。
addopts =
    -v
    --strict-markers
    --tb=short
    -r fEsxX
    --html=reports/uds_test_report.html
    --self-contained-html
    --cov=src
    --cov-config=.coveragerc
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:reports/coverage_html
    --cov-report=xml:reports/coverage.xml
    --cov-fail-under=100

# 自定义测试标记注册。
markers =
    session: UDS 0x10 诊断会话控制测试
    read_data: UDS 0x22 通过标识符读取数据测试
    security: UDS 0x27 安全访问与种子密钥流程测试
    write_data: UDS 0x2E 通过标识符写入数据测试
    robustness: 畸形报文、错误 CAN ID、连续请求等健壮性测试
    timing: P2 响应时间与诊断时序测试
    integration: 跨服务状态机集成测试
    slow: 耗时测试，例如后续压力测试或长时间稳定性测试

# 默认关闭实时日志，避免 85 条用例运行时输出过多。
# 当需要定位问题时，可临时执行：
# python -m pytest -o log_cli=true --log-cli-level=DEBUG
log_cli = false
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S